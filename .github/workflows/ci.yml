name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Test
        continue-on-error: true
        run: python -m pytest -q -rA --tb=short > /tmp/pytest_out.txt 2>&1; echo "PYTEST_EXIT=$?" >> "$GITHUB_ENV"
      - name: _ci_diagnose (temporary)
        if: always()
        run: |
          python3 - <<'PYEOF'
          text = open("/tmp/pytest_out.txt", encoding="utf-8", errors="replace").read()
          lines = text.splitlines()
          tail = lines[-150:]
          chunk = ""
          for line in tail:
              esc = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              if len(chunk) + len(esc) > 3800:
                  print(f"::notice::{chunk}")
                  chunk = ""
              chunk += esc + "%0A"
          if chunk:
              print(f"::notice::{chunk}")
          PYEOF
          if [ "${PYTEST_EXIT:-1}" != "0" ]; then exit 1; fi
